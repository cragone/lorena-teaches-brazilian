[package]
name = "evo-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
evo-core = { path = "../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "HtmlButtonElement",
  "CanvasRenderingContext2d", "CanvasGradient", "TextMetrics", "WebSocket", "MessageEvent", "CloseEvent", "Event",
  "KeyboardEvent", "MouseEvent", "PointerEvent", "Location", "Storage", "Response", "Request", "console",
  "AudioContext", "AudioDestinationNode", "AudioParam", "OscillatorNode", "OscillatorType", "GainNode", "AudioNode",
  "DomRect", "EventTarget", "UrlSearchParams", "CssStyleDeclaration", "AddEventListenerOptions", "HtmlCollection", "NodeList", "ResizeObserver", "Performance", "Node",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
