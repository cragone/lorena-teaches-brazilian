<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>evo</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" />
    <link data-trunk rel="copy-dir" href="public" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="apple-touch-icon" href="/public/apple-touch-icon.png" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #0a4a58 0%, #052c3a 55%, #020f17 100%);
      }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; display: block; }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 8, 14, 0.75) 100%);
      }
      #lobby {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 40%, rgba(10, 74, 88, 0.96) 0%, rgba(5, 44, 58, 0.98) 55%, #020f17 100%);
        font-family: system-ui, sans-serif;
        color: #e8fffb;
      }
      #lobby .card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; }
      #lobby h1 { margin: 0; font-size: 56px; letter-spacing: 4px; color: #b7fff0; text-align: center; }
      #lobby p { margin: 0; text-align: center; color: #8fd9cf; font-size: 14px; }
      #lobby input {
        font: inherit; font-size: 18px; padding: 12px; border-radius: 10px; border: 2px solid #1b6f7d;
        background: #03222e; color: #e8fffb; text-align: center; text-transform: uppercase; box-sizing: border-box; width: 100%;
      }
      #lobby #name { text-transform: none; }
      #lobby button {
        font: inherit; font-size: 18px; font-weight: 700; padding: 12px; border-radius: 10px; border: 2px solid #4cffd0;
        background: #15806a; color: #e8fffb; cursor: pointer;
      }
      #lobby button:disabled { opacity: 0.4; cursor: default; }
      #lobby .row { display: flex; gap: 8px; }
      #lobby .row input { flex: 1; }
      #lobby #rooms { display: flex; flex-direction: column; gap: 8px; max-height: 160px; overflow-y: auto; }
      #lobby #rooms button { background: #0b4a5a; font-size: 16px; }
      #lobby #error { min-height: 18px; color: #ff8fa3; }
      #settings-btn {
        position: fixed; left: 12px; bottom: 12px; z-index: 30; font: 700 13px system-ui, sans-serif; color: #e8fffb;
        background: rgba(3, 34, 46, 0.8); border: 2px solid #1b6f7d; border-radius: 10px; padding: 8px 12px; cursor: pointer;
      }
      #settings {
        position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px;
        background: rgba(0, 8, 14, 0.7); font-family: system-ui, sans-serif; color: #e8fffb;
      }
      #settings[hidden] { display: none; }
      #settings .scard {
        width: min(380px, 100%); background: #03222e; border: 2px solid #4cffd0; border-radius: 14px; padding: 18px;
        display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
      }
      #settings h2 { margin: 0 0 4px; text-align: center; color: #b7fff0; }
      #settings p { margin: 0; font-size: 12px; color: #8fd9cf; text-align: center; }
      #settings .srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      #settings button {
        font: 700 15px system-ui, sans-serif; color: #e8fffb; background: #15806a; border: 2px solid #4cffd0;
        border-radius: 8px; padding: 8px 14px; min-width: 96px; cursor: pointer;
      }
      #settings button.listening { background: #b03a86; border-color: #ffd0ec; }
    </style>
  </head>
  <body>
    <div id="lobby">
      <div class="card">
        <h1>evo</h1>
        <p>Eat, breed and evolve your species in one shared world</p>
        <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" />
        <button id="play">Play</button>
        <p id="world"></p>
        <p id="error"></p>
      </div>
    </div>
    <canvas id="game"></canvas>
    <button id="settings-btn">⚙ Controls</button>
    <div id="settings" hidden></div>
    <div id="vignette"></div>
      </body>
</html>
