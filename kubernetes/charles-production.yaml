apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prod-charles-services-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-charles-services
  namespace: default
spec:
  # SQLite lives on a single ReadWriteOnce volume, so this must stay at 1 replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prod-charles-services
  template:
    metadata:
      labels:
        app: prod-charles-services
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: prod-charles-services
          image: placeholder # replaced by pipeline via kubectl set image
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
            - name: DATA_DIR
              value: /data
            - name: COOKIE_SECURE
              value: "true"
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: charles-stripe
                  key: secret-key
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: charles-stripe
                  key: publishable-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: charles-stripe
                  key: webhook-secret
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prod-charles-services-data
---
apiVersion: v1
kind: Service
metadata:
  name: prod-charles-services-service
  namespace: default
spec:
  selector:
    app: prod-charles-services
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
