apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: leo-web
  namespace: default
spec:
  entryPoints:
    - websecure
  tls:
    secretName: charlesragone-com-tls
  routes:
    - match: Host(`leo.charlesragone.com`)
      kind: Rule
      services:
        - name: prod-leo-services-service
          port: 80
