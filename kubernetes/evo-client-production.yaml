# evo client: the Rust/WASM bundle behind a static file server. Stateless, so it can scale freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-evo-client
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prod-evo-client
  template:
    metadata:
      labels:
        app: prod-evo-client
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: prod-evo-client
          image: placeholder # replaced by pipeline via kubectl set image
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: prod-evo-client-service
  namespace: default
spec:
  selector:
    app: prod-evo-client
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
