# evo game server: relays WebSocket traffic between the players of a room and serves /api.
# Rooms live in this process's memory, so keep it at one replica: a second replica would
# split players into rooms the other one cannot see.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-evo-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-evo-server
  template:
    metadata:
      labels:
        app: prod-evo-server
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: prod-evo-server
          image: placeholder # replaced by pipeline via kubectl set image
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: prod-evo-server-service
  namespace: default
spec:
  selector:
    app: prod-evo-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
