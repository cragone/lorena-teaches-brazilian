# Decoy secrets are intentional. See HONEYPOT.md.
[extend]
useDefault = true

[allowlist]
description = "Honeypot decoy files"
paths = [
  '''client/src/config/legacyConfig\.ts''',
  '''client/public/\.env\.backup''',
  '''client/public/config\.json''',
  '''client/public/admin/config\.js''',
  '''honeypot/.*''',
  '''HONEYPOT\.md''',
]
