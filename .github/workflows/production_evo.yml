name: Production Deployment of evo.charlesragone.com

on:
  push:
    branches: [main]
    paths:
      - "evo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.AZURE_VM_IP }}" >> ~/.ssh/known_hosts

      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          key: ${{ secrets.AZURE_PEM_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "Running Deployment of PRODUCTION to k8s cluster..."
            cd lorena-teaches-brazilian
            git fetch origin main
            git reset --hard origin/main

            # -------------------------
            # Docker build + push: the game server and the client are separate images
            # -------------------------
            ACR="${{ secrets.ACR_LOGIN_SERVER }}"
            TAG="${{ env.sha_short }}"
            SERVER_IMAGE="$ACR/evo-server:$TAG"
            CLIENT_IMAGE="$ACR/evo-client:$TAG"

            echo "Logging in to ACR: $ACR"
            echo "${{ secrets.ACR_PASSWORD }}" | sudo docker login "$ACR" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            echo "Building docker images: $SERVER_IMAGE, $CLIENT_IMAGE"
            sudo docker build -t "$SERVER_IMAGE" -f evo/server/dockerfile evo/server
            sudo docker build -t "$CLIENT_IMAGE" -f evo/client/dockerfile evo

            echo "Pushing docker images"
            sudo docker push "$SERVER_IMAGE"
            sudo docker push "$CLIENT_IMAGE"

            # -------------------------
            # Kubernetes apply phase
            # -------------------------

            echo "Applying server + client Deployments and Services"
            sudo kubectl apply -f kubernetes/evo-server-production.yaml
            sudo kubectl apply -f kubernetes/evo-client-production.yaml

            # -------------------------
            # Set images + rollout
            # -------------------------
            echo "Updating deployment images"
            sudo kubectl -n default set image deployment/prod-evo-server prod-evo-server="$SERVER_IMAGE"
            sudo kubectl -n default set image deployment/prod-evo-client prod-evo-client="$CLIENT_IMAGE"

            echo "Waiting for rollouts..."
            sudo kubectl -n default rollout status deployment/prod-evo-server
            sudo kubectl -n default rollout status deployment/prod-evo-client

            # Route traffic only once both services are up: /api and /ws -> server, everything else -> client
            echo "Applying Traefik Middleware + IngressRoutes"
            sudo kubectl apply -f kubernetes/charles_ingress.yaml

            # the old single-container deployment is no longer routed to
            sudo kubectl -n default delete deployment/prod-evo-services service/prod-evo-services-service --ignore-not-found

            echo "SUCCESS: Deployed $SERVER_IMAGE and $CLIENT_IMAGE"
            echo "======END======"
