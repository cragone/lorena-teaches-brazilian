name: Production Deployment of Lorena's Tutoring Website

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.AZURE_VM_IP }}" >> ~/.ssh/known_hosts

      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          key: ${{ secrets.AZURE_PEM_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "Running Deployment of PRODUCTION to k8s cluster..."
            cd lorena-teaches-brazilian
            git fetch origin main
            git reset --hard origin/main

            # -------------------------
            # Docker build + push
            # -------------------------
            ACR="${{ secrets.ACR_LOGIN_SERVER }}"
            TAG="${{ env.sha_short }}"
            CLIENT_IMAGE="$ACR/lorena-client:$TAG"
            API_IMAGE="$ACR/lorena-api:$TAG"

            echo "Logging in to ACR: $ACR"
            echo "${{ secrets.ACR_PASSWORD }}" | sudo docker login "$ACR" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            echo "Building docker image: $CLIENT_IMAGE"
            sudo docker build --progress=plain -t "$CLIENT_IMAGE" -f client/Dockerfile client

            echo "Building docker image: $API_IMAGE"
            sudo docker build --progress=plain -t "$API_IMAGE" -f server/Dockerfile server

            echo "Pushing docker image: $CLIENT_IMAGE"
            sudo docker push "$CLIENT_IMAGE"

            echo "Pushing docker image: $API_IMAGE"
            sudo docker push "$API_IMAGE"

            # -------------------------
            # Kubernetes apply phase
            # -------------------------

            echo "Ensuring lorena-api-secrets exists"
            sudo kubectl -n default create secret generic lorena-api-secrets \
              --from-literal=admin-password="${{ secrets.LORENA_ADMIN_PASSWORD }}" \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            echo "Applying application Deployment + Service"
            sudo kubectl apply -f kubernetes/lorena-production.yaml
            sudo kubectl apply -f kubernetes/lorena-api-production.yaml


            echo "Applying Traefik Middleware + IngressRoutes"
            sudo kubectl apply -f kubernetes/lorena_ingress.yaml

            # -------------------------
            # Set image + rollout
            # -------------------------
            echo "Updating deployment image to: $CLIENT_IMAGE"
            sudo kubectl -n default set image deployment/prod-lorena-services \
              prod-lorena-services="$CLIENT_IMAGE"

            echo "Updating deployment image to: $API_IMAGE"
            sudo kubectl -n default set image deployment/prod-lorena-api \
              prod-lorena-api="$API_IMAGE"

            echo "Waiting for rollout..."
            sudo kubectl -n default rollout status deployment/prod-lorena-services
            sudo kubectl -n default rollout status deployment/prod-lorena-api

            echo "SUCCESS: Deployed $CLIENT_IMAGE and $API_IMAGE"
            echo "======END======"
